apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikepulse-api
  labels:
    app: bikepulse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bikepulse-api
  template:
    metadata:
      labels:
        app: bikepulse-api
    spec:
      containers:
        - name: bikepulse-api
          image: bikepulse-api:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
              name: http
          env:
            - name: ARTIFACTS_DIR
              value: "/code/artifacts"
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

