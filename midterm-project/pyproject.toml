[project]
name = "bikepulse-demand-forecasting"
version = "1.0.0"
description = "BikePulse: Urban Micromobility Hourly Demand Forecasting & Fleet Rebalancing Service (ML Zoomcamp 2026 Midterm Project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.0",
    "scikit-learn>=1.6.0",
    "uvicorn>=0.34.0",
    "xgboost-cpu>=3.0.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "xgboost>=3.0.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.10.0",
    "nbclient>=0.10.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "pytest>=8.3.0",
    "seaborn>=0.13.2",
]
